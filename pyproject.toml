[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datascope-uk-jobs"
version = "1.0.0"
description = "A documented UK data jobs intelligence pipeline and dashboard"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.6"]

[project.scripts]
ukjobs = "ukjobs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
